  <title>Cornelius Cayley Line</title>
  <script id="3" type="text/markdown">
    # Cornelius Cayley Line
  </script>
  <script id="1" type="text/html">
    <p><span class="fam">Cornelius Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-38" target="_blank" rel="noopener">⑂</a></span>&nbsp;(1644-1734), barrister and fourth son of Sir William Cayley, 1st baronet, married Ann Tyrwhitt in 1681. He and his wife Ann Tyrwhitt had at least five children:</p>
    <ul>
    <li><strong>John Cayley</strong>&nbsp;(1682-1716) , who was killed by Mrs Macfarlane – see the separate page <a href="john-cayley-killed-in-1716"><strong>John Cayley, killed in 1716</strong></a>.</li>
    <li><strong>Tyrwhitt Cayley</strong>&nbsp;(1683-1751), a career naval officer whose last command was of the 80-gun Lancaster. Among other duties, he patrolled the Newfoundland fisheries, protecting British fishing vessels. He and his wife (first name Elizabeth) acquired a residence at Ryde on the Isle of Wight. In 1719 they had a son, <strong>Cornelius Cayley</strong>, who died when he was about 10 weeks old. See&nbsp;<strong><a href="another-18th-century-cayley-left-out-of-the-peerages">Another 18th century Cayley left out of the Peerages</a></strong>. See <a href="will-of-elizabeth-cayley-of-leghorn-livorno-dated-2-may-1758"><strong>here</strong></a> for a transcript of his widow’s 1758 will.</li>
    <li><strong>Ann Cayley</strong>&nbsp;(1685-1687)</li>
    <li><strong>Dorothy Cayley</strong>&nbsp;(born in 1690), who married William Smelt MP (1690-1755), who represented Northallerton, Yorkshire from 1740 to 1745, when he was given the doubtless lucrative post of “Receiver General of Casual Revenue” in Barbados</li>
    <li><strong class="fam">Cornelius Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-35" target="_blank" rel="noopener">⑂</a></strong>&nbsp;(1692-1779), who followed in his father’s footsteps by qualifying as a barrister, and from 1725 to 1771 was recorder of Hull, Yorkshire. In 1723 he married another member of the Smelt family, Elizabeth Smelt (1695-1750). A transcript of his will is <a href="cornelius-cayley-of-hull-will-dated-20-october-1768"><strong>here</strong></a>.</li>
    </ul>
    <p><span class="fam">Cornelius Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-35" target="_blank" rel="noopener">⑂</a></span> (1692-1779) and Elizabeth Smelt had at least eight children:</p>
    <ul>
    <li><strong>William Cayley</strong>&nbsp;(1724-1784), who studied at Christ’s College, Cambridge. He became a clergyman, and held various livings in Yorkshire. He was a prebend of both Southwell Minster and York Minster; vicar of Stainton-in-Cleveland 1754-60; rector of Nunburnholme 1754-71; rector of Burton Agnes 1760 to his death; and rector of Rudstone 1771 to his death. He married Ann Williamson, daughter of an alderman of Hull, and left no surviving children.</li>
    <li><strong>Cornelius Cayley</strong>&nbsp;(1726-1727)</li>
    <li><strong>Cornelius Cayley</strong>&nbsp;(1727-1779), who became a methodist preacher: see the page on <a href="cornelius-cayley-methodist"><strong>Cornelius Cayley Methodist</strong></a>. This Cornelius led an extravagant early adulthood in London.</li>
    <li><strong>Leonard Cayley</strong>, born in 1729</li>
    <li><strong class="fam">John Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-32" target="_blank" rel="noopener">⑂</a></strong>&nbsp;(1730-1795), who became a Russia merchant in 1754 and spent most of the rest of his life in the close-knit circle of British merchants in St Petersburg where he was British Consul-General, at a salary of £300 a year, from 1787 to 1795. Shortly before his death he came back to England, and he died at his daughter Elizabeth’s house in Richmond, Surrey. He was buried at Lee churchyard in Kent. In 1756 he married Sarah Cozens, daughter of Richard Cozens who was a successful shipbuilder and constructed vessels for the Russian navy. For his descendants see the <a class="fam" href="russia-merchant-line"><strong>Russia merchant line</strong></a>. See <strong><a href="john-cayley-1730-1795-consul-general-in-st-petersburg">this blog post</a></strong> for documents relating to his being Consul-General.</li>
    <li><strong>Elizabeth Cayley</strong>&nbsp;(1731-1795), who died at Hull: a transcript of her will is <a href="will-of-elizabeth-cayley-of-kingston-upon-hull-dated-14-november-1794"><strong>here</strong></a>.</li>
    <li>
    <figure style="width: 220px;float:right;" class="wp-caption alignright"><img src="imgs/edward-cayley-1703-1805.webp" alt="Edward Cayley 1703-1805" width="220" height="260"><figcaption class="wp-caption-text">Edward Cayley 1703-1805</figcaption></figure>
    <p><strong>Edward Cayley</strong>&nbsp;(1733-1805) who lived at Whitby, Yorkshire, married twice. His first wife was Anne Simpson (marriage date 8 November 1760). In 1777 he married Mary Brown (1742-1810), daughter of Jonas Brown, who came from a prominent Whitby family with plantation interests in the Caribbean. There is a transcript of his will <a href="will-of-edward-cayley-of-whitby-dated-14-june-1800"><strong>here </strong></a>and of Mary’s will <a href="mary-cayley-of-whitby-will-dated-2-april-1810"><strong>here</strong></a>.</p></li>
    <li><strong>George Cayley</strong>&nbsp;(1735-1790), who was born in Hull and went to St Petersburg as one of the Cayley Russia merchants. he died at Beverley, Yorkshire. In St Petersburg he married Anne Prescott (1750-1776) in 1774, and they had one son, another <strong>Cornelius Cayley</strong>, who was born in January 1776 and died the following September, possibly of the same illness which killed his mother a few days later.</li>
    </ul>
    <p>Edward Cayley and Anne Simpson had seven children:</p>
    <ul>
    <li><strong>Isabella Cayley</strong> (1762-1845) who married twice. Her first husband was Major Mottram Thomas Brackenbury; the second (marriage year 1827) was William Kaye of Nottingham near Hull, Yorkshire</li>
    <li><strong>Cornelius Cayley</strong> (c.1764-1798) who married someone called Elizabeth but died without surviving children: see <a href="will-of-cornelius-cayley-of-leigh-surrey-dated-17-may-1798"><strong>this page</strong></a> for his Will. His father lamented&nbsp;in his Will that he could not provide adequately for his daughters because of the extraordinary and ill conduct of my late son Cornelius”.</li>
    <li><strong>Elizabeth Cayley</strong> (1765-1815) who married William Barker of Whitby, Yorkshire</li>
    <li><strong>William Cayley</strong>, born in 1766, who died in infancy</li>
    <li><strong>William Simpson Cayley</strong>, born in 1767, who also died in infancy</li>
    <li><strong>Jane Cayley</strong> (1767-1788)</li>
    <li><strong>Ann Cayley</strong> (1768-1796)</li>
    </ul>
    <p>Edward Cayley and his second wife Mary Brown had six children, several of whom finally settled at Stamford, Lincolnshire:</p>
    <ul>
    <figure style="width: 217px;float:right;" class="wp-caption alignright"><img src="imgs/mary-cayley-1778-1837.webp" alt="Mary Cayley 1778-1837" width="217" height="272"><figcaption class="wp-caption-text">Mary Cayley 1778-1837</figcaption></figure>
    <li><strong>Mary Cayley</strong>&nbsp;(1778-1837), who spent much of her life at Whitby and died in Stamford. There is a transcript of her will <a href="will-of-mary-cayley-of-whitby-yorkshire-dated-1-march-1831"><strong>here</strong></a>.</li>
    <li><strong>Ann Cayley</strong>, b. 1779</li>
    <li><strong>Margaret Cayley</strong>, b. 1781, who married twice. The identity of her first husband is uncertain but her second was a Major Chadwick.</li>
    <li><strong>Edward Cayley&nbsp;</strong>(1782-1868), who settled in Stamford, where he was a successful banker and a town councillor. In 1828 he married Frances Twopeny (1796-1851), one of six good-looking daughters of the Reverend Richard Twopeny, rector of Little Casterton, County Rutland: the daughters were collectively nicknamed by people outside the family the “splendid shilling”. For his descendants, see&nbsp;<a href="a-bankers-family"><strong>a Banker’s Family</strong></a>.</li>
    <li>
    <figure style="width: 207px;float:right;" class="wp-caption alignright"><img src="imgs/jessy-cayley-b-1784.webp" alt="Jessy Cayley b 1784" width="207" height="268"><figcaption class="wp-caption-text">Jessy Cayley b.1784</figcaption></figure>
    <p><strong>Jessy Cayley</strong>, b. 1784, who married Samuel Fenton of Underbank, Yorkshire, a substantial house which in the twentieth century became &nbsp; the headquarters of a sizeable company.</p></li>
    <li><strong>Thomas Cayley</strong>&nbsp;(1786-1857), who went to the West Indies to manage the estates of his uncle Thomas Brown, himself acquiring lands and slaves there. In 1812, when he was captaining a ship, he witnessed – and wrote a lengthy account of – an eruption of Mt Soufrière: this has been donated by some members of the Cayley family to the British Library. (See the blog post <strong><a href="2017/12/30/an-early-19th-century-volcanic-eruption-in-the-caribbean" target="_blank" rel="noopener">An Early 19th Century Volcanic Eruption in the Caribbean</a></strong>.)&nbsp;According to a family legend, he once abandoned a cargo of slaves when his ship foundered, but this may well be myth. He became a magistrate of St Vincent, where, in 1809, he married Margaret Harrison. Later they returned to England, and he died at Stamford. A transcript of his will, dated 10 October 1856, is <a href="will-of-thomas-cayley-of-whitby-yorkshire-dated-10-october-1856"><strong>here</strong></a>.</li>
    </ul>
  </script>
