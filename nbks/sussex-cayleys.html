    # Sussex Cayleys
  </script>
  <script id="1" type="text/html">
    <p>Apart from the family which migrated to Yorkshire, the main pre-19th grouping of Cayleys seems to have been in East Sussex. In medieval times, the de Cailly family owned extensive lands north of the Sussex part of the South Downs, so it is possible that these Cayleys are descended from the same family that gave rise to the Cayleys of Brompton, Yorkshire. There is, though, no proof of this.</p>
    <figure style="width: 240px;float: right; margin: 0 0 1em 1em;">
      <img src="imgs/all-saints-heathfield-sussex.webp" alt="All Saints Heathfield Sussex" width="240">
      <figcaption>All Saints, Heathfield</figcaption>
    </figure>
    <p>The Cayleys seems to have settled at <a href="https://en.wikipedia.org/wiki/Heathfield,_East_Sussex" target="_blank" rel="noopener">Heathfield</a>, a village in the Weald: there are a number of records of baptisms, marriages and burials at the parish church of All Saints in the 18th century. In the previous century, two, a Thomas Cayley and a William Cayley, moved to <a href="https://en.wikipedia.org/wiki/Lamberhurst" target="_blank" rel="noopener">Lamberhurst</a>, just across the boundary with Kent – Thomas's will mentions that his older brother Edward Cayley was a yeoman of Heathfield. Information about these Cayleys can be found at <a href="sussex-and-kent-cayleys-of-the-16th-to-18th-centuries.html">Sussex and Kent Cayleys of the 16th to 18th centuries</a>.</p>
    <p>By the mid to late 1700s one part of the family was based at nearby <a href="https://en.wikipedia.org/wiki/Maresfield" target="_blank" rel="noopener">Maresfield</a>, some ten miles west of Heathfield. There John Cayley, husband of Sarah Anne Bradbury, was probably born in about 1768. You can see information about him and his descendants on the page <a href="cayley-bradbury-line.html">Cayley-Bradbury line</a>.</p>
  </script>
