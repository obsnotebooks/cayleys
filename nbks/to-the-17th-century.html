    # To the 17th Century
  </script>
  <script id="1" type="text/html">
<p><strong>Hugh de Caly</strong>, the son of Osbert de Caly, married Agnes de Hemstede. Besides Owby and other lands in Norfolk, he owned a quarter of a knight’s fee at Richmond in Yorkshire. In 1268-9 he and his wife made a gift to the monks of Walsingham. He left money for the monks at St Helen’s, Norwich, to sing masses for his and Agnes’ souls: the monks were released from this obligation in 1350.</p>
<p>Hugh and Agnes had two sons:</p>
<ul>
<li><strong>Sir William Cayley</strong>, Lord of Owby, Suffield and Hecham in Norfolk (he sold Hecham in 1316-7).</li>
<li><strong>John de Caly</strong>, who was recorded in 1303 as holding a knight’s fee at Staincliffe in the West Riding of Yorkshire</li>
</ul>
<p>Sir William Cayley’s son <strong>John de Cailly</strong>&nbsp;was sheriff of Norfolk and Suffolk and keeper of Norwich Castle from 1331 to 1336. There are some uncertainties about the family tree from then until the late 16th century, and firm dates are for a period largely nonexistent: there were a succession of Johns and Williams, and it is not entirely clear how many generations there were. What follows is a somewhat conjectural attempt at a reconstruction of the line of descent.</p>
<p>It is likely that John de Cailly had two sons:</p>
<ul>
<li><strong>William Cayley</strong>, who lived in Norfolk, married Alice Braose, and had two daughters:
<ul>
<li><strong>Eva Cayley</strong>, his main heir, who married Edmund Clipsby (Edmund thus inherited William Cayley’s main estates, and he assumed the arms of the Cayley family)</li>
<li><strong>Agnes Cayley</strong>, who married John Harslike, a Norfolk landowner.</li>
</ul>
</li>
<li><strong>John Cayley</strong>, who held three knights’ fees in the Owby area of Norfolk, but by the end of his life had settled at Normanton in Yorkshire.</li>
</ul>
<p>John Cayley probably had three sons:</p>
<ul>
<li><strong>Hugh Cayley</strong>, who may be the Hugh Cayley fined at Macclesfield Hundred Court in 1368 for causing an affray, and who died childless</li>
<li><strong>William Cayley</strong>, who lived at Normanton, and whose daughter Jennet Cayley&nbsp;married John Lake, whose descendants were a prominent Normanton family</li>
<li><strong>John Cayley</strong>, who probably had two sons:
<ul>
<li>another <strong>John Cayley</strong>&nbsp;who died childless</li>
<li><strong>Edmund Cayley</strong>, who had homes at Thormanby and York.</li>
</ul>
</li>
</ul>
<p>Edmund Cayley had two sons:</p>
<ul>
<li>the younger, another <strong>John Cayley</strong>, was a priest at Thormanby (the Cayleys had the advowson of this parish – the right to appoint the priest)</li>
<li>the older, <strong>William Cayley</strong>, lived at Thormanby and inherited the Cayley’s Yorkshire lands.</li>
</ul>
<p>William Cayley’s son <strong>John Cayley</strong> lived at Malton and had three sons:</p>
<ul>
<li><strong>Edward Cayley</strong>, his main heir, who may have died in or before 1561, when his elder son was granted the advowson of Thormanby</li>
<li><strong>William Cayley</strong>, another priest at Thormanby</li>
<li><strong>Lawrence Cayley </strong></li>
</ul>
<p>Edward Cayley had two sons, and we start now to be on firmer ground, with some definite dates:</p>
<ul>
<li><strong>William Cayley</strong>&nbsp;of Thormanby, who married Joan Gouldthorp, the daughter of a wealthy merchant of York, Richard Gouldthorp, who was Mayor of York in 1588. William died in 1586, and Joan in 1618.</li>
<li><strong>Richard Cayley </strong></li>
</ul>
<p>William Cayley had two sons:</p>
<ul>
<li><strong>Edward Cayley <a href="https://wikitree.com/wiki/Cayley-168" target="_blank" rel="noopener">⑂<small>168</small></a></strong>, who purchased lands at Brompton-by-Sawdon, inland from Scarborough, where the main Cayley line was to be based. He married Anne Walters, daughter of William Walters of Cundall, and died at Brompton in 1642. His wife had died two years earlier, in 1640. In 1630 he was one of many gentry invited to accept a knighthood on the coronation of Charles I: this would have carried the obligation to pay for a troop of horse if the king wished. Edward Cayley refused the honour, but had to pay a fine of £25 instead. This was a fairly common way for new monarchs to raise funds. Edward is the father of the first baronet, see <strong><a class="fam" href="some-17th-century-cayleys">Some 17th Century Cayleys</a></strong>.</li>
<li><strong>James Cayley</strong>&nbsp;who lived at Thormanby. He was a royalist in the English Civil War and in 1646 he had to pay a fine to the Parliamentarians to retain his lands. He married Mary Bell, daughter of Ralph Bell of Sowerby. He had four sons. Three – <strong>Edward Cayley</strong>, <strong>Peter Cayley</strong>&nbsp;and <strong>Matthew Cayley</strong>&nbsp;– died fighting under Prince Rupert for Charles I in the Battle of Marston Moor, 2 July 1644. This was the largest battle of the Civil War, and their victory gave the Parliamentarians control of the North of England. The fourth son, <strong>Richard Cayley</strong>, survived the battle and played a key role in the negotiations which preserved his father’s lands in 1646.</li>
</ul>
