<h3>THE ORIGINS</h3>
<p><strong>Osbern de Cailly</strong>&nbsp;(11th century). Probably descended from Richard the Fearless, 3rd Duke of Normandy.</p>
<ul>
<li><strong>Guillaume de Cailly</strong>&nbsp;m. Maude de Beaumont. Came to England with the Norman Conquest, probably fighting at Hastings.
<ul>
<li><strong>William de Cailly</strong>. Held lands in East Anglia and Sussex, including at Trumpington near Cambridge, where the mill features in Chaucer’s Miller’s Tale.</li>
<li>&nbsp;<strong>Humphrey</strong> <strong>de</strong> <strong>Cailly</strong>&nbsp;(see below)</li>
<li><strong>Osbern de Preaux</strong>&nbsp;(born Osbern de Cailly, but took his wife’s name on marriage). Inherited some of his father’s lands in Normandy but renounced his claim to most of the Cailly land in Normandy when he acquired other lands through his wife.</li>
<li><strong>Roger de Cailly</strong>&nbsp;m. Petronella de Vere. Took over most of the Cailly lands in Normandy when his father went to England.</li>
</ul>
</li>
</ul>
<h3>THE DE PREAUX LINE</h3>
<p><strong>Osbern de Preaux</strong>&nbsp;had 4 sons and 1 daughter. The oldest son, <strong>Osbert de Preaux</strong> had six sons, among whom were:</p>
<ul>
<li><strong>Jean des Preaux&nbsp;</strong>(d. 1218), who in the 1180’s headed a commission set up to resolve differences between Philippe-Auguste, King of France, and the English crown. He had lands in both England and Normandy, and founded the priory of Beaulieu in Hampshire, where he and some of his descendants were buried. When Philippe-Auguste invaded Normandy (then ruled by King John of England), he sided with the French. His English lands were confiscated. After conquering Normandy, Philippe-Auguste probably sent him as an envoy to England. One of his sons, Guillaume de Preaux, accompanied Richard I of England on the Third Crusade: he saved Richard’s life in one battle, but was taken prisoner. Richard I exchanged 6 captured emirs to secure his release. Another of his sons became Archdeacon of Rouen.</li>
<li><strong>Peter des Preaux</strong>&nbsp;(d. between 1207 and 1212) who was one of King John’s chief commanders in his wars with Philippe-Auguste of France, and was warden of the Channel Islands. In 1204 he defended Rouen against the French. He negotiated an armistice under which Rouen would be surrendered if no relief came within 30 days – and none did. After the surrender, there were rumours that he had been bribed, but he seems to have retained King John’s favour. He was a signatory to the treaty finally ceding Normandy to the French, and joined King John in England.</li>
<li><strong>Guillaume</strong>&nbsp;or <strong>Raoul des Preaux</strong>, who held lands in Touraine. He lent King John money and was granted the income of the Viscounty of Lieuvin until the debt was paid, with tenants forced to pay double the normal rent to him. Following John’s loss of Normandy, he initially stayed there but came to England late in John’s reign.</li>
</ul>
<h3>THE DE CAILLY FAMILY IN ENGLAND</h3>
<p><strong>Humphrey de Cailly</strong>, son of the Guillaume who came to England with the Norman Conquest, had a son, <strong>Simon de Cailly</strong>&nbsp;(d. 1218), who owned extensive lands in Norfolk.</p>
<p>Among Simon de Cailly’s children was <strong>Roger de Cailly</strong>, who probably held the main Cailly lands in Norfolk, and was rich enough to make large loans to King Henry II. Roger de Cailly had at least two sons:</p>
<ul>
<li><strong>Osbern de Cailly</strong>&nbsp;(d. before 1200), who was one of the more important Norman barons, acquiring some of his lands by marriage. One of his daughters, Matilda, married Henry de Vere, and, after Henry’s death, Regnald de Bosco. Another, Alice, married Stephen de Longchamp who fought under King John of England against Philippe-Auguste, was imprisoned after he lost a fortress, and in the end stayed in Normandy, giving allegiance to the French King. Stephen de Longchamp died in 1214 in the Battle of Bouvines, fighting for the French. A third daughter, Petronella, married Geffrey de Bosco.</li>
<li><strong>John de Caly</strong>, who inherited the main family lands in Norfolk.</li>
</ul>
<p>John had at least one son, another <strong>John de Caly</strong>, whose widow Margery married Michael de Poynings, whose name – derived from the Sussex manor of Poynings – suggests that by then the Cailly family had started to acquire lands in Sussex. This John had four sons:</p>
<ul>
<li><strong>Hugo de Caly</strong></li>
<li><strong>Elias de Caly</strong>&nbsp;and <strong>Ralph de Caly</strong>, who entrusted lands to the Priory of Lewes when they went on crusade and seem never to have recovered them</li>
<li><strong>Adam de Caly</strong>, who inherited the main lands in Norfolk, and joined in baronial rebellions in the last years of the reign of King John.</li>
</ul>
<p>Elias and Adam married into the powerful Giffard family. Elias’s great-grandson, another&nbsp;<strong>John de Caly</strong>, inherited the Giffard lands in 1327.</p>
<p>Adam de Caly’s main heir, <strong>Osbert de Caly</strong>, fought for Edward I in Wales in 1287.</p>
<p><strong>Osbert de Caly</strong>‘s younger son, <strong>Hugh de Caly</strong>, is probably the first member of the family recorded to have held lands in Yorkshire, and from him the Yorkshire Cayleys descend. The older son, <strong>Adam de Caly</strong>, married Emma de Tateshall, whose family owned extensive lands in Sussex and elsewhere. Adam had at least three children:</p>
<ul>
<li><strong>Thomas de Cailly</strong>, Adam’s main heir, who married Margaret de Norwich. She was the daughter of Sir Walter de Norwich, Justice of Norfolk, who was appointed Treasurer to King Edward II in 1314. In 1307 Thomas inherited a third of the Tateshall lands in Sussex, Hampshire and elsewhere. He fought against the Scots, and attended several parliaments as a baron. Following his death in 1316 without an heir, his lands passed to his nephew Adam de Clifton.</li>
<li><strong>Margery de Caly</strong>, who married Roger de Clifton: as a result of this marriage the Clifton family inherited the main Caly/Cailly lands in East Anglia and elsewhere when the senior branch of the family had no male heirs.</li>
<li><strong>Adam de Cailly</strong>, who&nbsp;fought against the Scots and was the Adam de Cailly ransomed from them in about 1328. See the blog post&nbsp;<strong><a href="2018/03/28/ransomed-from-the-scots/">Ransomed from the Scots</a></strong>.</li>
<li><b>Edmund de Caly</b>, subject of the blog post&nbsp;<a href="2018/05/29/more-medieval-mayhem/"><b>More Medieval Mayhem</b></a>, was probably another son.</li>
</ul>
