  <title>Sir George Cayley, 6th Baronet</title>

    # Sir George Cayley, 6th Baronet
  </script>
  <script id="1" type="text/html">
		<figure><img src="imgs/bust-of-sir-george-cayley-6th-baronet.webp" alt="Bust of Sir George Cayley 6th baronet" width="257" height="389"><figcaption>Bust of Sir George Cayley, 6th Baronet</figcaption></figure>
<p>Sir George Cayley, the 6th Cayley baronet (1773-1857), is most famous as the “father of aeronautics”, with his work on heavier-than-air flight and his glider experiments. There is plenty of information on the web about this aspect of his life – some links can be found in the <strong><a href="miscellaneous/links">Links</a></strong> page on this site. This page concentrates on other facets of Sir George.</p>
<p>His education was not the standard gentleman’s one of attendance at Oxford or Cambridge. Those universities concentrated on the traditional classical education for the upper classes, and many gentry and aristocrats who attended did not bother to take their degrees. Instead at the age of 18 he began study at Nottingham with George Walker, a non-conformist minister with a keen interest in science and mathematics. Four years later George Cayley married George Walker’s daughter Sarah. In 1792 he went on to study with George Cadogan Morgan in Southgate, Middlesex: Morgan was a Unitarian minister, who had helped to found Hackney College in London in 1787 for pupils from ordinary backgounds, and who was an eye-witness of the Fall of the Bastille, probably being the first person to report the event in England. Sir George himself was almost certainly a Unitarian by belief.</p>
<p>His interest in aeronautics developed early, with the first surviving records of his research dating back to 1794.</p>
<p>In 1800 Sir George and other local landowners instigated the draining and embankment of long stretches of the River Derwent in North Yorkshire – a river prone to flooding, with a catastrophic flood in 1799. The main work on this continued to 1810, and besides protecting people from flooding greatly improved the agricultural land alongside the river.</p>
<p>He was a caring landlord, who in 1805 gave an acre each to all the labourers in Brompton, Yorkshire who were capable of tilling it – an early instance of allotments.</p>
<p>Among his many inventions were:</p>
<ul>
<li>a new type of wheel, with tension spokes, intended for aircraft but later to evolve into the bicycle wheel</li>
<li>the caterpillar tread for vehicles – originally designed for farm vehicles, to make it easier for them to cope with boggy ground. Sir George termed the tread the “universal railway”.</li>
<li>an artificial hand for an injured farm worker</li>
<li>an electric motor</li>
</ul>
<p>Over many years he worked on ideas for a “hot air engine” capable of powering flight, but he never succeeded in making one light enough. One of his engines was being trialled on a road vehicle in 1840 in Chelsea, London when it went out of control and crashed through the window of a jeweller’s shop, fatally injuring the driver, who was Sir George’s chief engineer, Thomas Wadeson. At the inquest Sir George was fined £10 by the jury as an indication of their disapproval of the use of steam vehicles on public highways.</p>
<p>Related to his interest in aeronautics were researches into ballistics, on which he published several papers.</p>
<p>In his later years Sir George was much preoccupied with railway safety, prompted by a number of fatal accidents. He advocated safety belts, wrote on the subject to the then Prime Minister Sir Robert Peel in 1845, and worked on designs for railway buffers and other safety devices.</p>
<p>He was a great believer in adult education, especially for those who had not had the benefit of a gentry background or of university.</p>
<ul>
<li>In Yorkshire he
<ul>
<li>became the first President of the York Mechanics’ Institute in 1827</li>
<li>and helped to found the Yorkshire and Scarbrouogh Philosophical Societies (“philosophical” carried its etymological sense – “loving knowledge”)</li>
</ul>
</li>
<li>Nationally he was a founder member of the British Association.</li>
<li>In London he actively fostered the Adelaide Gallery, where there were lectures and demonstrations of mechanical inventions. The Gallery lost much of its educational purpose, becoming largely a fashionable place to visit, and most of its educational role was taken over from 1838 by the Royal Polytechnic Institution, Regent Street (which evolved into the present University of Westminster): Sir George played a key role in the Institute’s foundation, and was its first chairman, and under his influence it offered evening classes in science, engineering, navigation and railway-engine driving.</li>
</ul>
<p>In politics, Sir George was long a whig, and a keen advocate of parliamentary reform. From 1821 he was president of the York Whig Club; he resigned in 1827, declaring that distinctions between Whig and Tory had become largely superfluous. He represented Scarborough in Parliament from 1832 to 1834. It was largely he who was responsible for the introduction of gas lighting in the Houses of Parliament.</p>
<p>He corresponded widely, and met many of the eminent scientists of his day, including the French naturalist <a href="https://en.wikipedia.org/wiki/Georges_Cuvier" target="_blank" rel="noopener"><strong>Cuvie</strong>r</a>&nbsp;(to whom he took a specimen of a fossil tree) and <strong><a href="https://en.wikipedia.org/wiki/Babbage" target="_blank" rel="noopener">Charles Babbage</a></strong>, with whom he became an intimate friend. His letters show a curiosity over subjects ranging from archaeology to astronomy. There is a sizeable collection of correspondence in the British Library.</p>
<p>But his life wasn’t all serious. As a young man, he was an expert fencer. He liked fly-fishing. He delighted in performing conjuring tricks. He allowed his children and grandchildren to play among bits of his flying-machines and other apparatus. His letters show a flirtatious enjoyment of female company, and a keen if somewhat ponderous sense of humour. He dabbled in verse, and wrote a charming poem to his wife on her 80th birthday. Shortly before his death, he called the doctor in and had in his pocket two little packets wrapped in paper – one containing a guinea for the consultation fee, and the other some peppermint lozenges. He gave the doctor the wrong one. When the doctor told him of the slip, he sent the money with a note containing the lines:</p>
<p style="padding-left:30px;">The fee was sweet – I thank you for the hint,<br>
These are as sweet. They’ve both been through the Mint.</p>
<p>It is fitting to conclude with some advice he gave in a letter to one of his daughters: “Be not distressed by any worldly misgivings whatever; this is our school only, towards an Eternity of Friendship, and Love that knows no end; the present momentary turmoil of mix’d bliss and sorrow, sufficient to keep us active, is but a grain of sand to Solid Earth. Let us then hold our souls in Peace, and smile at the terrible Masks that would scare us from our equipoise, for love is tittering behind the frowns of the fancied Demon.”</p>
