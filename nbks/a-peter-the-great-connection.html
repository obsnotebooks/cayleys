    # A Connection to Peter the Great
    Peter the Great did much to pave the way for modern Russia. He also founded St Petersburg, where the <a class="fam" href="russia-merchant-line">Cayley Russian merchants</a> mainly operated.

    One of the Cayley Russia merchants, William Cayley (1766-1803), married Elizabeth Cavanaugh. Elizabeth’s mother, Mary Cozens, was daughter of Richard Cozens, who was one of Peter the Great’s master shipbuilders: Peter took a keen personal interest in ship-building and poured money into creating an effective Russian navy.  What I did not know until today is that, according to a report in <em>The Scots Magazine</em> of Mary Cozens’ death in 1806, Peter was Mary’s godfather.

    Thank you to WikiTree member L. Moberly for bringing this to the attention of Michael Cayley.

    Source: <cite>The Scots Magazine</cite>, Vol. LXVIII, 1806, p. 887, viewable on <a href="https://books.google.ca/books?id=n8ozAQAAMAAJ&amp;newbks=1&amp;newbks_redir=0&amp;printsec=frontcover&amp;pg=PA887#v=onepage&amp;q&amp;f=false" target="_blank" rel="noopener">Google Books⬀</a>.
