    # The Howland Connection
  </script>
  <script id="1" type="text/html">
  <p>A certain amount was made, in the family yore, of the suggestion that once Arthur married a Howland the resulting branch of the family would be descended from both ‘companions of the Conqueror’ and passengers on the <cite>Mayflower</cite>. Well, conquerer-companions: yes, but the <cite>Mayflower</cite> story is nuanced. Katherine can trace her lineage back to Henry, the younger brother of John Howland. John was a passenger on the <cite>Mayflower</cite> and there’s a good story from the voyage. (See below.) Henry followed him on the Puritan’s Great Migration.</p>

    <p><span class="fam">Katherine Vanderweken Howland <a class="fam" href="https://wikitree.com/wiki/Howland-5445" target="_blank" rel="noopener">⑂<small>5445</small></a></span> (1898-1973).</p>
