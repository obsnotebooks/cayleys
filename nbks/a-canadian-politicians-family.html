  <title>A Canadian Politician’s Family</title>
  <script id="2" type="text/markdown">
    # A Canadian Politician’s Family
  </script>
  <script id="1" type="text/html">
    <div class="entry-content">
    <p><span class="fam">William Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-123" target="_blank" rel="noopener">⑂<small>123</small></a></span> (1807-1890), Canadian politician, lawyer and businessman, and his wife Emma Robinson Boulton (1818-1890) had ten children:</p>
    <ul>
    <li><strong class="fam">John d’Arcy Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-346" target="_blank" rel="noopener">⑂<small>346</small></a></strong>&nbsp;(1837-1911), a clergyman who was born in England. He married Mary Magdalene Cartwright (d. 1900) in 1861 in Sussex, where he was curate in charge of a church near Lewes. In 1863 they emigrated to Ontario, Canada. There he was rector of Whitby (1863-1874), and of St George’s, Toronto from 1874. In 1889 he became a canon and precentor of the Anglican Cathedral in Toronto.</li>
    <li><strong>Harriet Ann Cayley</strong>&nbsp;(b. 1839)</li>
    <li>
    <figure style="width: 168px; float: right;" class="wp-caption alignright"><img src="imgs/sophia-emma-cayley-1851-1930-in-1879.webp" alt="Sophia Emma Cayley 1851-1930 in 1879" width="168" height="265"><figcaption class="wp-caption-text">Sophia Emma Cayley (1851-1930) in 1879</figcaption></figure>
    <p><strong>Francis Cayley</strong>&nbsp;(1845-1909), born in Toronto, who married Jane Isabel Easton (d. 1920) in 1874. They had four children:</p>
    <ul>
    <li><strong>Emma Robinson Cayley</strong>&nbsp;(b. 1876)</li>
    <li><strong>Adelaide Mary Cayley</strong>&nbsp;(b. 1877) who married R H Strickland</li>
    <li><strong>Muriel Isabel Cayley</strong>&nbsp;(b. 1879) who married Jay Scholefield</li>
    <li><strong>William Henry Cayley</strong>&nbsp;(b. 1881)</li>
    </ul>
    </li>
    <li><strong>Mary Cayley</strong>&nbsp;(1847-1890), known as Minnie, who married Captain W Glascott (1837-1880) in 1866, and had twelve children</li>
    <li><strong>Sophia Emma Cayley</strong>&nbsp;(born in Toronto in 1851, died in Wandsworth, Surrey, England in 1930)</li>
    <li><strong>William Cayley</strong>&nbsp;(b. 1852)</li>
    <li><strong>Richard Cayley</strong>&nbsp;(b. c.1854)</li>
    <li>
    <figure style="width: 154px; float: right;" class="wp-caption alignright"><img src="imgs/hugh-st-quentin-cayley-1857-1934.webp" alt="Hugh St Quentin Cayley 1857-1934" width="154" height="211"><figcaption class="wp-caption-text">Hugh St Quentin Cayley 1857-1934</figcaption></figure>
    <p><strong>Hugh St Quentin Cayley</strong>&nbsp;(1857-1934), a barrister and politician who moved to Calgary in 1882, was Premier of the Candian North West Territories, and in 1897 moved moved to Vancouver, where he became a senior judge. In that year he married Leonora Adelaide Cochrane (1873-1934) in Vernon, British Columbia, and they had one son:</p>
    <ul>
    <li><strong>Beverley Cochrane Cayley</strong>&nbsp;(1898-1928), a keen mountaineer who loved climbing in the Rockies. Mt Cayley&nbsp;in the Cascades Range is named after him.</li>
    </ul>
    </li>
    <li><strong>Beverley Cayley</strong>&nbsp;(1859-1880)</li>
    <li><strong>Arthur Cayley</strong>&nbsp;(1859-1880)</li>
    </ul>
    <p><span class="fam">John d’Arcy Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-346" target="_blank" rel="noopener">⑂<small>346</small></a></span> and Mary Magdalene Cartwright had five children:</p>
    <ul>
    <li><strong>Mary Augusta Cayley</strong>&nbsp;(1862-1926), who was born in Sussex, England, went to Canada with her father, and subsequently returned to England: she died at Hastings, Sussex</li>
    <li><strong class="fam">Edward Cartwright Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-681" target="_blank" rel="noopener">⑂<small>681</small></a></strong>&nbsp;(1864-1921), a Toronto clergyman who in 1895 married Alice Broughall (d. 1951)</li>
    <li><strong>Arthur Macaulay Cayley</strong>&nbsp;(1867-1910), a career army officer who rose to the rank of Major in the Royal Artillery of the British army</li>
    <li><strong>Cecil Maud Cayley</strong>&nbsp;(b. c.1868 in Ontario, died in 1916 at King’s Norton, Worcestershire, England)</li>
    <li><strong>Emma Madeline Cayley</strong>&nbsp;(d. 1940), who in 1902 married Noel Burn Rosher.</li>
    </ul>
    <p><span class="fam">Edward Cartwright Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-681" target="_blank" rel="noopener">⑂<small>681</small></a></span> and Alice Broughall had six children:</p>
    <ul>
    <li><strong class="fam">Arthur Bowen Cayley <a class="fam" href="https://wikitree.com/wiki/Cayley-687" target="_blank" rel="noopener">⑂<small>687</small></a></strong>&nbsp;(1898-1973), who was wounded and captured in World War 1. In 1921 he married <span class="fam">Katherine Vanderweken Howland <a class="fam" href="https://wikitree.com/wiki/Howland-5445" target="_blank" rel="noopener">⑂<small>5445</small></a></span> (d. 1973).</li>
    <li><strong>Hugh Cartwright Cayley</strong>&nbsp;(1901-1967), who lived in Toronto and in 1928 married Ethel Ann Farquharson Matthews (d. 1934)</li>
    <li><strong>Alice Margaret Cayley</strong>, who married Arthur Arundell Harcourt Vernon (b. 1895) in 1925. Her husband served in both World Wars.</li>
    <li><strong>Cicely Cayley</strong>&nbsp;(d. 1906)</li>
    <li><strong>Sylvia Cayley</strong>&nbsp;(1909-1990), who in 1937 married a clergyman, Terence Patrick Crosthwait</li>
    <li><strong>Ray d’Arcy Cayley</strong>&nbsp;(b. 1912), who married William Ramsay Osler in 1947.</li>
    </ul>
    <p>The Canadian website <a href="http://cayley.ca/wiki/wiki.php?n=Cayley.FrontPage?from=Site.FrontPage" target="_blank" rel="noopener"><strong>Cayley Family⬀</strong></a> has photos of some of the houses where some of these Cayleys lived, with some biographical information and some links to further information.</p>
    </div>
  </script>
